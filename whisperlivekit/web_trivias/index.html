<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Trivias STT – Live transcriptie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-title">
          <span class="logo-dot"></span>
          <span>Trivias STT</span>
        </div>
        <div class="app-header-right">
          <span class="tag tag-model">model: large-v3</span>
          <span class="tag tag-lang">taal: NL</span>
          <button id="sessionsBtn" class="tag tag-sessions">
            📂 Sessies
          </button>
        </div>
      </header>

      <main class="app-main">
        <section class="panel panel-main">
          <div class="panel-header">
            <h2>Live transcriptie</h2>
            <span id="recordingTimer" class="timer">00:00</span>
          </div>
          <div id="liveTranscript" class="transcript-box">
            Nog geen tekst… Configureer kanalen en klik op <strong>Start</strong>.
          </div>
        </section>

        <aside class="panel panel-side">
          <div class="panel-header panel-header-tabs">
            <div class="tab-bar">
              <button class="tab-btn active" data-tab="control">Bediening</button>
              <button class="tab-btn" data-tab="config">Configuratie</button>
            </div>
          </div>

          <!-- Bediening tab -->
          <div id="tab-control" class="tab-pane">
            <div class="status-row">
              <span class="status-label">Verbinding</span>
              <span id="connectionStatus" class="status-value status-disconnected">Niet verbonden</span>
            </div>
            <div class="status-row">
              <span class="status-label">Server-modus</span>
              <span id="modeStatus" class="status-value">–</span>
            </div>
            <div class="status-row">
              <span class="status-label">ASR-status</span>
              <span id="asrStatus" class="status-value">Wachten op opname…</span>
            </div>
            <div class="controls">
              <button id="recordButton" class="record-button">🎙 Start</button>
              <p id="hintText" class="hint">
                Stel kanalen in via <strong>Configuratie</strong>, dan klik <strong>Start</strong>.
              </p>
            </div>
          </div>

          <!-- Configuratie tab -->
          <div id="tab-config" class="tab-pane hidden">
            <div id="channelConfigList" class="channel-config-list"></div>
            <button id="addChannelBtn" class="add-channel-btn">+ Kanaal toevoegen</button>
            <label class="cross-gate-toggle">
              <input type="checkbox" id="crossGateToggle" checked>
              Cross-kanaal anti-lek (aanbevolen)
            </label>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="app.js"></script>

    <!-- Sessie browser modal -->
    <div id="sessionsModal" class="sessions-modal hidden">
      <div class="sessions-modal-inner">
        <div class="sessions-modal-header">
          <h2>Opgeslagen sessies</h2>
          <button id="sessionsModalClose" class="sessions-close">✕</button>
        </div>
        <div id="sessionsList" class="sessions-list">
          <p class="sessions-loading">Laden...</p>
        </div>
      </div>
    </div>
  </body>
</html>
